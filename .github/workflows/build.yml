name: Build Mod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  JAVA_OPTS: -Xmx3G

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Instalar Gradle 8.10
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget -q https://services.gradle.org/distributions/gradle-8.10-bin.zip
          unzip -q gradle-8.10-bin.zip
          echo "$PWD/gradle-8.10/bin" >> $GITHUB_PATH

      - name: Compilar con Gradle
        run: gradle build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mochilaoj-mod
          path: build/libs/*.jar

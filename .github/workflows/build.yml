name: Build Mod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar Gradle
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle

      - name: Compilar el mod
        run: gradle build

      - name: Subir archivo
        uses: actions/upload-artifact@v4
        with:
          name: mochilaoj-mod
          path: build/libs/*.jar
          

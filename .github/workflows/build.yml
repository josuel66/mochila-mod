name: Build Mod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  JAVA_OPTS: -Xmx3G

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Dar permiso de ejecución
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mochilaoj-mod
          path: build/libs/*.jar
          
